services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e2e2380
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e2e2380"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: e2euser
      MINIO_ROOT_PASSWORD: e2epassword123
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 一次性初始化 MinIO bucket（幂等）：mc 带重试等 MinIO 就绪，保证分片/导出对象有落点。
  # 应用侧 _minio() 也有 bucket_exists/make_bucket 兜底，双保险。
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_started}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 e2euser e2epassword123; do sleep 2; done &&
      mc mb --ignore-existing local/e2e-2380 &&
      echo MINIO_BUCKET_READY
      "

  # 被测系统 + 桩服务（模型网关桩 / 复核队列桩 / 本地转写桩）
  # 测试自身用 pytest 起 uvicorn 连这些真实后端；此服务用于手工端到端联调/占位。
  sut:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      E2E_PG_DSN: postgresql://postgres:postgres@postgres:5432/e2e2380
      E2E_PG_ADMIN_DSN: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: e2euser
      MINIO_SECRET_KEY: e2epassword123
      MINIO_BUCKET: e2e-2380
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
